[package]
name = "relais-smtp"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "relais-smtp"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "hostname", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"

[profile.release]
opt-level = 3
strip = true
