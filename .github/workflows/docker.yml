# Construit l'image Docker du Relais SMTP, la publie sur le registre registry.selutech.fr
# puis, si un serveur est configuré, l'installe dessus par SSH.
#
# Réglages du dépôt GitHub (Settings > Secrets and variables > Actions) :
#   Secrets obligatoires :
#     REGISTRY_USERNAME identifiant du registre registry.selutech.fr
#     REGISTRY_PASSWORD mot de passe (ou jeton) du registre
#   Variables :
#     IMAGE_NAME        nom de l'image dans le registre (facultatif, « relais-smtp » par défaut)
#     DEPLOY_HOST       adresse du serveur (sans elle, l'étape d'installation est sautée)
#     DEPLOY_USER       utilisateur SSH sur le serveur (il doit pouvoir lancer docker)
#     DEPLOY_PORT       port SSH (facultatif, 22 par défaut)
#     SMTP_PUBLISH      port SMTP publié sur le serveur (facultatif, 2525 par défaut)
#     WEB_PUBLISH       port de l'interface web publié sur le serveur (facultatif, 8080 par défaut)
#     PLATFORMS         architectures de l'image (facultatif, « linux/amd64 » par défaut ;
#                       « linux/amd64,linux/arm64 » pour un Raspberry Pi ou un NAS ARM, plus lent)
#   Autres secrets :
#     DEPLOY_SSH_KEY    clé SSH privée autorisée sur le serveur
#     ADMIN_PASSWORD    mot de passe de l'interface web (facultatif)

name: Image Docker

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: registry.selutech.fr
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'relais-smtp' }}

jobs:
  image:
    name: Construire et publier l'image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Nom de l'image
        id: name
        run: |
          repo="${REGISTRY}/$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "image=${repo}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Connexion à registry.selutech.fr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Étiquettes
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.repo }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Construction et publication
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ vars.PLATFORMS || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Installer sur le serveur
    needs: image
    if: github.event_name != 'pull_request' && vars.DEPLOY_HOST != '' && (github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Mise à jour du conteneur par SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          REGISTRY: ${{ env.REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SMTP_PUBLISH: ${{ vars.SMTP_PUBLISH || '2525' }}
          WEB_PUBLISH: ${{ vars.WEB_PUBLISH || '8080' }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE,REGISTRY,REGISTRY_USERNAME,REGISTRY_PASSWORD,ADMIN_PASSWORD,SMTP_PUBLISH,WEB_PUBLISH
          script: |
            set -eu
            echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin
            docker pull "$IMAGE"
            docker network inspect relais >/dev/null 2>&1 || docker network create relais
            docker rm -f relais-smtp >/dev/null 2>&1 || true
            set -- -d --name relais-smtp --restart unless-stopped --network relais \
              -p "${SMTP_PUBLISH}:2525" -p "${WEB_PUBLISH}:8080" \
              -e TZ=Europe/Paris -v relais-smtp-data:/data
            if [ -n "${ADMIN_PASSWORD:-}" ]; then set -- "$@" -e "ADMIN_PASSWORD=${ADMIN_PASSWORD}"; fi
            docker run "$@" "$IMAGE"
            docker logout "$REGISTRY"
            docker image prune -f >/dev/null
            sleep 5
            docker ps --filter name=relais-smtp --format 'Relais SMTP : {{.Status}}'
